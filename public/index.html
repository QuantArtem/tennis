<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Теннисный клуб</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div class="ball" aria-hidden="true"></div>
    <h1 id="title">Теннисный клуб</h1>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="games" class="on"><span>🎾</span>Игры</button>
    <button data-tab="matches"><span>✅</span>Сыграно</button>
    <button data-tab="top"><span>🏆</span>Рейтинг</button>
    <button data-tab="me"><span>👤</span>Профиль</button>
  </nav>
  <div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
